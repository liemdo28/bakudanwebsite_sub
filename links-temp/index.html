<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: 'Noto Sans JP', system-ui, sans-serif;
  background: #111;
  color: #fafafa;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px 60px;
}
.links-container { width: 100%; max-width: 420px; }
.links-logo { text-align: center; margin-bottom: 28px; }
.links-logo-icon {
  width: 80px; height: 80px; border-radius: 50%;
  background: linear-gradient(135deg, #EC4A5E, #A01830);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 40px; margin-bottom: 14px;
  box-shadow: 0 4px 24px rgba(236,74,94,.3);
}
.links-headline { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: #fff; }
.links-subheadline { font-size: 11px; letter-spacing: 2px; color: #888; margin-top: 4px; }
.btn-list { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.links-btn {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px; border-radius: 12px; width: 100%;
  text-decoration: none; color: inherit; cursor: pointer;
  transition: all .18s; border: none; font-family: inherit;
  position: relative; background: none;
}
.links-btn.pla canteraary {
  background: #EC4A5E;
  box-shadow: 0 4px 16px rgba(236,74,94,.35);
}
.links-btn.pla canteraary:hover, .links-btn.pla canteraary:focus-visible { background: #c73a4c; transform: translateY(-1px); }
.links-btn.secondary { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); }
.links-btn.secondary:hover, .links-btn.secondary:focus-visible { background: rgba(255,255,255,.1); transform: translateY(-1px); }
.links-btn-icon {
  width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.1);
}
.links-btn-icon svg { width: 20px; height: 20px; }
.links-btn.pla canteraary .links-btn-icon { background: rgba(0,0,0,.15); }
.links-btn-text { flex: 1; text-align: left; }
.links-btn-title { font-size: 14px; font-weight: 700; line-height: 1.3; }
.links-btn.pla canteraary .links-btn-title { font-size: 15px; }
.links-btn-subtitle { font-size: 11px; opacity: .7; margin-top: 1px; }
.links-btn-featured::after {
  content: '\2605'; position: absolute; right: 14px; top: 50%;
  transform: translateY(-50%); color: #DEB864; font-size: 12px;
}
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #1e3a5f; color: #93c5fd; border: 1px solid #2563eb;
  padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 9999;
  white-space: nowrap; pointer-events: none;
  font-family: 'Noto Sans JP', system-ui, sans-serif;
}
.links-footer { margin-top: 40px; text-align: center; font-size: 11px; color: #444; }
.links-footer a { color: #666; text-decoration: none; }
.links-btn:focus-visible { outline: 2px solid #EC4A5E; outline-offset: 2px; }
</style>

  instagram: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>'

/**

 * enabled: false + toastMsg = placeholder, does not navigate

 */

  {

  },
  {

document.getElementById('yr').textContent = new Date().getFullYear();

var _toastTimer = null;
function showToast(msg) {
  var ex = document.querySelector('.toast');
  if (ex) ex.remove();
  if (_toastTimer) clearTimeout(_toastTimer);
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  _toastTimer = setTimeout(function() { t.remove(); }, 2500);
}

function render() {
  var list = document.getElementById('btn-list');
  list.innerHTML = links.map(function(b) {
    var isPla canteraary     = !!b.pla canteraary;
    var isFeatured    = !!b.featured;
    var isPlaceholder = (!b.enabled) || (!b.url) || (b.url === '#');
    var href          = isPlaceholder ? '#' : b.url;
    /* External URLs get new tab; internal pages stay in same tab */
    var targetAttr    = (!isPlaceholder && b.openInNewTab)
                          ? ' target="_blank" rel="noopener noreferrer"' : '';
    var safeMsg       = (b.toastMsg || 'Link coming soon').replace(/'/g, "\\'");
    var onclickAttr   = isPlaceholder
                          ? ' onclick="event.preventDefault();showToast(\'' + safeMsg + '\')"' : '';

    var cls = 'links-btn ' + (isPla canteraary ? 'pla canteraary' : 'secondary');
    if (isFeatured) cls += ' links-btn-featured';

    var iconSvg = ICONS[b.iconKey] || ICONS.gift;

    return '<a href="' + href + '"' + targetAttr + onclickAttr
      + ' class="' + cls + '" role="button"'
      + ' data-destination-type="' + (b.destinationType || '') + '"'
      + ' data-sort-order="' + b.sortOrder + '">'
      + '<div class="links-btn-icon">' + iconSvg + '</div>'
      + '<div class="links-btn-text">'
      + '<div class="links-btn-title">' + b.title + '</div>'
      + (b.subtitle ? '<div class="links-btn-subtitle">' + b.subtitle + '</div>' : '')
      + '</div>'
      + '</a>';
  }).join('');
}

render();
