<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<title>Join the Bakudan Ramen Email &amp; SMS Club</title>
<meta name="description" content="Sign up for Bakudan Ramen offers, menu updates, birthday rewards, and event announcements at your favorite location.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: 'Noto Sans JP', system-ui, sans-serif;
  background: #111;
  color: #fafafa;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px 60px;
}
.signup-container { width: 100%; max-width: 420px; }
.signup-logo { text-align: center; margin-bottom: 24px; }
.signup-logo-icon {
  width: 72px; height: 72px; border-radius: 50%;
  background: linear-gradient(135deg, #EC4A5E, #A01830);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 36px; margin-bottom: 14px;
  box-shadow: 0 4px 24px rgba(236,74,94,.3);
}
.signup-heading { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1px; color: #fff; line-height: 1.2; }
.signup-description { font-size: 13px; color: #aaa; margin-top: 10px; line-height: 1.5; }

.signup-step-label {
  color: #aaa; font-size: 11px; font-weight: 700; letter-spacing: 1.4px;
  text-transform: uppercase; margin: 28px 0 10px; padding: 0 4px;
}
.location-list { display: flex; flex-direction: column; gap: 10px; }
.location-btn {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px 18px; border-radius: 12px; width: 100%;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
  color: inherit; cursor: pointer; text-align: left;
  font-family: inherit; font-size: 15px; font-weight: 700;
  transition: all .18s;
}
.location-btn:hover { background: rgba(255,255,255,.1); transform: translateY(-1px); }
.location-btn.selected { background: #EC4A5E; border-color: #EC4A5E; box-shadow: 0 4px 16px rgba(236,74,94,.35); }
.location-btn-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); flex-shrink: 0; }
.location-btn.selected .location-btn-check { background: #fff; border-color: #fff; }

.continue-btn {
  width: 100%; margin-top: 24px; padding: 16px 18px; border-radius: 12px;
  background: #EC4A5E; color: #fff; border: none; font-family: inherit;
  font-size: 15px; font-weight: 700; cursor: pointer;
  box-shadow: 0 4px 16px rgba(236,74,94,.35); transition: all .18s;
}
.continue-btn:disabled { background: rgba(255,255,255,.08); color: #666; box-shadow: none; cursor: not-allowed; }
.continue-btn:not(:disabled):hover { background: #c73a4c; transform: translateY(-1px); }

#signup-loading, #signup-error { text-align: center; padding: 60px 20px; color: #555; }
.signup-footer { margin-top: 40px; text-align: center; font-size: 11px; color: #444; }
.signup-footer a { color: #666; text-decoration: none; }
</style>
</head>
<body>

<div class="signup-container">
  <div id="signup-loading">Loading...</div>
  <div id="signup-content" style="display:none">
    <div class="signup-logo">
      <div class="signup-logo-icon">爆</div>
      <div class="signup-heading" id="signup-heading">Join the Bakudan Ramen Email &amp; SMS Club</div>
      <div class="signup-description" id="signup-description"></div>
    </div>
    <div class="signup-step-label">Choose your location</div>
    <div class="location-list" id="location-list"></div>
    <button class="continue-btn" id="continue-btn" disabled>Select a location to continue</button>
  </div>
  <div id="signup-error" style="display:none">
    <div style="font-size:28px;margin-bottom:12px">爆</div>
    <div style="color:#EC4A5E;font-weight:700;margin-bottom:8px">Signup unavailable</div>
    <div style="font-size:13px">Please try again later, or contact your nearest Bakudan Ramen location directly.</div>
  </div>
</div>

<div class="signup-footer">
  &copy; <span id="signup-year"></span> Bakudan Ramen &mdash; <a href="/">bakudanramen.com</a>
</div>

<script>
(function() {
  document.getElementById('signup-year').textContent = new Date().getFullYear();
  let selectedUrl = null;

  async function load() {
    let data;
    try {
      const res = await fetch('/api/public/marketing-signup', { cache: 'no-store' });
      data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data?.message || 'Failed to load');
    } catch (e) {
      document.getElementById('signup-loading').style.display = 'none';
      document.getElementById('signup-error').style.display = 'block';
      return;
    }

    document.getElementById('signup-loading').style.display = 'none';
    document.getElementById('signup-heading').textContent = data.heading || 'Join the Bakudan Ramen Email & SMS Club';
    document.getElementById('signup-description').textContent = data.description || '';

    const continueBtn = document.getElementById('continue-btn');
    continueBtn.textContent = data.button_label || 'Continue to Signup';

    const locations = data.locations || [];
    const listEl = document.getElementById('location-list');
    if (!locations.length) {
      listEl.innerHTML = '<div style="text-align:center;color:#555;padding:12px">No locations are configured yet. Please check back soon.</div>';
    } else {
      listEl.innerHTML = locations.map((loc, i) => `
        <button type="button" class="location-btn" data-idx="${i}">
          <span>${escapeHtml(loc.name)}</span>
          <span class="location-btn-check"></span>
        </button>
      `).join('');
      listEl.querySelectorAll('.location-btn').forEach((btn, i) => {
        btn.addEventListener('click', () => {
          listEl.querySelectorAll('.location-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedUrl = locations[i].toast_signup_url;
          continueBtn.disabled = !selectedUrl;
          continueBtn.textContent = selectedUrl ? (data.button_label || 'Continue to Signup') : 'Signup unavailable for this location';
        });
      });
    }

    continueBtn.addEventListener('click', () => {
      if (selectedUrl) window.open(selectedUrl, '_blank', 'noopener');
    });

    document.getElementById('signup-content').style.display = 'block';
  }

  function escapeHtml(value) {
    return String(value || '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;',
    }[ch]));
  }

  load();
})();
</script>
</body>
</html>
