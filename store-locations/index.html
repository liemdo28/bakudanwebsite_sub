<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: 'Noto Sans JP', system-ui, sans-serif;
  background: #111;
  color: #fafafa;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px 60px;
}
.links-container { width: 100%; max-width: 420px; }
.links-logo { text-align: center; margin-bottom: 28px; }
.links-logo-icon {
  width: 80px; height: 80px; border-radius: 50%;
  background: linear-gradient(135deg, #EC4A5E, #A01830);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 40px; margin-bottom: 14px;
  box-shadow: 0 4px 24px rgba(236,74,94,.3);
}
.links-headline { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: #fff; }
.links-subheadline { font-size: 11px; letter-spacing: 2px; color: #888; margin-top: 4px; }

/* Back link */
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  color: #555; font-size: 12px; text-decoration: none;
  margin-bottom: 24px; letter-spacing: .5px;
  transition: color .15s;
}
.back-link:hover { color: #888; }
.back-link svg { width: 14px; height: 14px; }

/* Section label */
.section-label {
  font-size: 10px; letter-spacing: 2px; color: #555;
  text-transform: uppercase; margin-bottom: 12px; text-align: center;
}

/* Location cards — same component as /links buttons */
.btn-list { display: flex; flex-direction: column; gap: 10px; }
.location-card {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 18px; border-radius: 12px; width: 100%;
  text-decoration: none; color: inherit;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.12);
  transition: all .18s; position: relative;
}
.location-card:hover, .location-card:focus-visible {
  background: rgba(255,255,255,.1);
  transform: translateY(-1px);
  border-color: rgba(255,255,255,.22);
}
.location-card:focus-visible { outline: 2px solid #EC4A5E; outline-offset: 2px; }

.card-icon {
  width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.08);
}
.card-icon svg { width: 20px; height: 20px; }

.card-body { flex: 1; text-align: left; }
.card-name    { font-size: 15px; font-weight: 700; }
.card-address { font-size: 11px; opacity: .55; margin-top: 3px; line-height: 1.4; }

.card-arrow {
  color: #444; flex-shrink: 0;
}
.card-arrow svg { width: 16px; height: 16px; }

/* Footer */
.links-footer { margin-top: 40px; text-align: center; font-size: 11px; color: #444; }
.links-footer a { color: #666; text-decoration: none; }
</style>
