<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading... — Bakudan Ramen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<style>
.post-hero { width: 100%; max-height: 420px; overflow: hidden; }
.post-hero img { width: 100%; height: 420px; object-fit: cover; }
.post-content-wrap { max-width: 720px; margin: 0 auto; padding: 48px 5%; }
.post-meta { font-size: 12px; color: var(--color-text-muted); margin-bottom: 18px; letter-spacing: .5px; }
.post-title { font-family: 'Playfair Display', serif; font-size: 2.4rem; line-height: 1.25; margin-bottom: 20px; color: var(--color-text-light); }
.post-body  { font-size: 16px; line-height: 1.8; color: var(--color-text-muted); }
.post-body h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--color-text-light); margin: 32px 0 14px; }
.post-body h3 { font-size: 1.2rem; color: var(--color-text-light); margin: 24px 0 10px; }
.post-body p  { margin-bottom: 16px; }
.post-body ul, .post-body ol { margin: 0 0 16px 24px; }
.post-body li { margin-bottom: 6px; }
.post-body strong { color: var(--color-text-light); }
.post-body a { color: var(--color-accent-red); text-decoration: underline; }
.post-body img { max-width: 100%; border-radius: 10px; margin: 20px 0; }
.post-body blockquote { border-left: 3px solid var(--color-accent-red); padding-left: 16px; margin: 20px 0; font-style: italic; color: var(--color-text-muted); }
.post-cta { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; background: var(--color-accent-red); color: #fff; border-radius: 8px; font-weight: 700; font-size: 15px; text-decoration: none; margin-top: 28px; transition: background .2s; }
.post-cta:hover { background: var(--color-accent-red-dark); }
.post-hashtags { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 8px; }
.post-hashtag  { background: var(--color-bg-card); border: 1px solid var(--color-border); padding: 4px 12px; border-radius: 20px; font-size: 12px; color: var(--color-text-muted); }
.post-media    { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin: 24px 0; }
.post-media img, .post-media video { width: 100%; border-radius: 8px; }
.post-back-link { font-size: 13px; color: var(--color-accent-red); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 20px; }
</style>
</head>
<body>

<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="site-header" role="banner">
  <a href="/index.html" class="logo">
    <div class="logo-icon" aria-hidden="true">&#29190;</div>
    <span class="logo-text">BAKUDAN RAMEN</span>
  </a>
  <nav aria-label="Main navigation">
    <ul class="nav-links">
      <li><a href="/index.html">Home</a></li>
      <li><a href="/menu.html">Menu</a></li>
      <li><a href="/locations.html">Locations</a></li>
      <li><a href="/happy-hour.html">Happy Hour</a></li>
      <li><a href="/about.html">Our Story</a></li>
      <li><a href="/blog.html">Blog</a></li>
      <li><a href="/order.html" class="nav-cta">Order Now</a></li>
    </ul>
  </nav>
  <button class="hamburger" aria-expanded="false" aria-controls="mobile-nav" aria-label="Open menu"><span></span><span></span><span></span></button>
</header>
<div class="mobile-nav" id="mobile-nav">
  <a href="/index.html">Home</a><a href="/menu.html">Menu</a><a href="/locations.html">Locations</a>
  <a href="/happy-hour.html">Happy Hour</a><a href="/about.html">Our Story</a><a href="/blog.html">Blog</a>
  <a href="/order.html" class="nav-cta" style="margin-top:1rem">Order Now</a>
</div>

<main id="main-content">
  <div id="post-hero-wrap"></div>
  <div class="post-content-wrap">
    <a href="/blog-cms" class="post-back-link">&#8592; Back to Blog</a>
    <div id="post-body-wrap"><div style="text-align:center;padding:60px;color:var(--color-text-muted)">Loading...</div></div>
  </div>
</main>

<footer style="background:var(--color-bg-warm);padding:40px 5%;text-align:center;color:var(--color-text-muted);font-size:13px;border-top:1px solid var(--color-border)">
  &copy; <span id="post-year"></span> Bakudan Ramen. All rights reserved.
</footer>

<script src="/js/main.js"></script>
<script>
document.getElementById('post-year').textContent = new Date().getFullYear();

// Extract slug from URL: /blog-cms/post/{slug}
const parts = window.location.pathname.split('/').filter(Boolean);
const slug  = parts[parts.length - 1];

async function loadPost() {
  const res  = await fetch('/api/public/blog/' + encodeURIComponent(slug));
  const data = await res.json();

  if (!res.ok || !data.ok) {
    document.getElementById('post-body-wrap').innerHTML = '<div style="text-align:center;padding:40px"><div style="font-size:2rem;margin-bottom:12px">&#x1F614;</div><div>Post not found.</div><a href="/blog-cms" style="color:var(--color-accent-red)">Back to Blog</a></div>';
    return;
  }

  const post = data.data.post;

  // Update page title & meta
  document.title = post.title + ' — Bakudan Ramen';
  const metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.content = post.excerpt || post.title;

  // Hero image
  if (post.featured_image_url) {
    document.getElementById('post-hero-wrap').innerHTML = `<div class="post-hero"><img src="${post.featured_image_url}" alt="${post.title}" loading="eager"></div>`;
  }

  // Hashtags
  const hashArr = (post.hashtags || '').split(/[\s,]+/).filter(h => h.startsWith('#'));
  const hashHtml = hashArr.length ? `<div class="post-hashtags">${hashArr.map(h => `<span class="post-hashtag">${h}</span>`).join('')}</div>` : '';

  // Additional media
  const mediaHtml = (post.media||[]).length ? `
    <div class="post-media">
      ${post.media.map(m => m.media_type === 'video'
        ? `<video src="${m.url}" controls style="border-radius:8px"></video>`
        : `<img src="${m.url}" alt="${m.alt_text||''}" loading="lazy">`
      ).join('')}
    </div>` : '';

  document.getElementById('post-body-wrap').innerHTML = `
    <div class="post-meta">${post.published_at ? new Date(post.published_at).toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'}) : ''}</div>
    <h1 class="post-title">${post.title}</h1>
    ${post.caption ? `<p style="font-size:15px;color:var(--color-text-muted);margin-bottom:24px;font-style:italic">${post.caption}</p>` : ''}
    <div class="post-body">${post.content_html || '<p>No content yet.</p>'}</div>
    ${mediaHtml}
    ${hashHtml}
    ${post.cta_label && post.cta_url ? `<a href="${post.cta_url}" class="post-cta" target="_blank">${post.cta_label} &#8594;</a>` : ''}
  `;
}

loadPost().catch(err => {
  console.error(err);
  document.getElementById('post-body-wrap').innerHTML = '<div style="text-align:center;padding:40px;color:var(--color-text-muted)">Failed to load post. <a href="/blog-cms" style="color:var(--color-accent-red)">Back to Blog</a></div>';
});
</script>
</body>
</html>
