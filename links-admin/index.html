<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-3GZ2RYDR6M');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Links Hub — Admin</title>

<!-- Quill rich text editor (for Blog Composer) -->
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">

<link rel="stylesheet" href="/links-admin/app.css">
</head>
<body class="bkdn-spa">

<div id="app">
  <!-- Loading shell — replaced on DOMContentLoaded by app.js -->
  <div id="spa-loading" style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0f172a;color:#fff;font-family:sans-serif">
    <div style="text-align:center">
      <div style="font-size:56px;margin-bottom:14px">爆</div>
      <div id="spa-loading-msg" style="color:#64748b;font-size:14px;letter-spacing:.5px">Loading Links Hub...</div>
      <div id="spa-loading-err" style="display:none;margin-top:28px;max-width:400px;padding:18px 22px;background:#1e293b;border:1px solid #7f1d1d;border-radius:12px;text-align:left">
        <div style="color:#fca5a5;font-weight:700;margin-bottom:6px">&#9888; Admin failed to start</div>
        <div id="spa-err-detail" style="color:#94a3b8;font-size:12px;margin-bottom:14px">The admin interface did not load. Check that the server is running on port 3000.</div>
        <button onclick="window.location.reload()" style="padding:8px 18px;background:#ef4444;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-weight:700">Reload Page</button>
      </div>
    </div>
  </div>
</div>

<!-- Boot watchdog: 10s timeout, independent of app.js -->
<script>
(function () {
  var t = setTimeout(function () {
    if (window.BKDN_BOOTED) return;
    var msg = document.getElementById('spa-loading-msg');
    var err = document.getElementById('spa-loading-err');
    if (msg) msg.style.display = 'none';
    if (err) err.style.display = 'block';
    if (!window.BKDN_CONFIG) {
      var detail = document.getElementById('spa-err-detail');
      if (detail) detail.textContent = 'BKDN_CONFIG missing — ensure the Node.js server is running (npm start).';
    }
  }, 10000);
  document.addEventListener('bkdn:booted', function () { clearTimeout(t); });
})();
</script>

<!-- Quill.js -->
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

<!-- Main SPA -->
<script src="/links-admin/app.js?v=20260702-section-management-3"></script>
</body>
</html>
