version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: linktreehl-mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: linktreehl
    volumes:
      - linktreehl_mysql:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linktreehl-app
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      DATABASE_URL: mysql://root:password@mysql:3306/linktreehl
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3010}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3010}
    volumes:
      - linktreehl_uploads:/app/public/uploads
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  linktreehl_mysql:
  linktreehl_uploads:
