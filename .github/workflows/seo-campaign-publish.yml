name: SEO campaign publish

# Separate from deploy-production.yml on purpose -- this workflow never
# touches that file or its trigger. It reuses the existing PRODUCTION_*
# secrets for the SFTP endpoint (no new secrets needed there) but ALSO
# requires DREAMHOST_HOST_KEY (strict SSH host-key verification -- see
# scripts/campaign/scheduler.py's connect_ssh(); the workflow fails closed
# without it, on purpose) and BAKUDAN_REMOTE_WR (the bounded target
# directory, explicit rather than hardcoded).
#
# All git operations (fetch, scoped add, commit, bounded-retry push) happen
# INSIDE scripts/campaign/scheduler.py via scripts/campaign/git_ops.py --
# this workflow does not run any git commands itself, and never stages a
# wildcard path.
#
# Safe by default: content/campaign/campaign-state.json ships with
# automation_enabled: false, and scheduler.py checks that flag before doing
# anything. This workflow can run on its schedule indefinitely without
# publishing anything until that flag is flipped on (a separate, reviewed
# commit) after each new article batch passes controlled rollout.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: seo-campaign-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # PRODUCTION_* secrets are scoped to the "production" GitHub Environment
    # (same as deploy-production.yml) -- without this, secrets.PRODUCTION_*
    # below would silently resolve to empty strings and every deploy would
    # fail closed on missing env vars. DREAMHOST_HOST_KEY is a repo-level
    # secret, which remains accessible either way (repo secrets are always
    # available; environment scoping only adds environment-specific ones).
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install paramiko

      - name: Run scheduler (publishes at most one due, approved article)
        id: run
        env:
          BAKUDAN_SFTP_HOST: ${{ secrets.PRODUCTION_HOST }}
          BAKUDAN_SFTP_PORT: ${{ secrets.PRODUCTION_PORT }}
          BAKUDAN_SFTP_USER: ${{ secrets.PRODUCTION_USERNAME }}
          BAKUDAN_SFTP_PASS: ${{ secrets.PRODUCTION_PASSWORD }}
          BAKUDAN_REMOTE_WR: ${{ secrets.PRODUCTION_TARGET_DIR }}
          DREAMHOST_HOST_KEY: ${{ secrets.DREAMHOST_HOST_KEY }}
        run: python scripts/campaign/scheduler.py

      # Durable backup evidence: scheduler.py writes scripts/_deploy_backups/
      # (gitignored, never committed) with a manifest.json per run containing
      # remote path + timestamp + sha256 checksum for every file it replaced.
      # Upload it as a build artifact so it survives after this ephemeral
      # runner is destroyed, instead of relying on the runner's local disk.
      - name: Upload deploy backup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-deploy-backup-${{ github.run_id }}
          path: scripts/_deploy_backups/
          retention-days: 90
          if-no-files-found: ignore
